# {GitHub Actions workflow deploying nanobot-api Cloudflare Worker using Wrangler with secure credentials} [Commented by: Google AI Studio on October 15, 2026 at 10:16 AM]

name: Deploy Cloudflare Worker Backend

on:
  push:
    branches:
      - main
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy nanobot-api Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'worker/package.json'

      - name: Install Worker Dependencies
        working-directory: worker
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          fi

      # {Direct Cloudflare Worker deployment with verified D1 database_id from wrangler.toml} [Commented by: Google AI Studio on October 17, 2026 at 02:43 AM]
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'worker'
          command: deploy
