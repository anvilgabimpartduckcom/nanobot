# {GitHub Actions workflow deploying nanobot-api Cloudflare Worker using Wrangler with secure credentials} [Commented by: Google AI Studio on October 15, 2026 at 10:16 AM]

name: Deploy Cloudflare Worker Backend

on:
  push:
    branches:
      - main
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy nanobot-api Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'worker/package.json'

      - name: Install Worker Dependencies
        working-directory: worker
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          fi

      # {Auto-discover and bind existing D1 database UUID for nanobot-chat-history to prevent deployment error 10021} [Commented by: Google AI Studio on October 17, 2026 at 02:29 AM]
      - name: Resolve D1 Database UUID
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPLICIT_D1_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          UUID_REGEX="^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"

          # 1. Check if user configured an explicit D1_DATABASE_ID in GitHub secrets
          if [ -n "$EXPLICIT_D1_ID" ] && echo "$EXPLICIT_D1_ID" | grep -Eq "$UUID_REGEX"; then
            echo "Using D1 database UUID from repository secret D1_DATABASE_ID: $EXPLICIT_D1_ID"
            sed -i "s/database_id = .*/database_id = \"$EXPLICIT_D1_ID\"/" wrangler.toml
          else
            # 2. Check if wrangler.toml already contains a valid UUID
            CURRENT_ID=$(grep -E '^[[:space:]]*database_id[[:space:]]*=' wrangler.toml | cut -d '"' -f2 || true)
            if echo "$CURRENT_ID" | grep -Eq "$UUID_REGEX" && [ "$CURRENT_ID" != "00000000-0000-0000-0000-000000000000" ]; then
              echo "Valid database UUID already configured in wrangler.toml: $CURRENT_ID"
            else
              # 3. Query Cloudflare D1 API using Wrangler to auto-discover the UUID of existing database 'nanobot-chat-history'
              echo "Auto-discovering D1 database UUID for 'nanobot-chat-history' from Cloudflare..."
              AUTO_ID=$(npx wrangler d1 list --json 2>/dev/null | jq -r '.[] | select(.name=="nanobot-chat-history") | .uuid' 2>/dev/null | head -n 1 || true)
              if echo "$AUTO_ID" | grep -Eq "$UUID_REGEX"; then
                echo "Discovered existing D1 database UUID: $AUTO_ID"
                sed -i "s/database_id = .*/database_id = \"$AUTO_ID\"/" wrangler.toml
              else
                echo "Notice: Could not automatically query D1 database UUID via CLI."
                echo "If your Cloudflare API token lacks D1:Read permission, please add repository secret 'D1_DATABASE_ID' or update worker/wrangler.toml with the UUID from Cloudflare Dashboard (Storage & Databases -> D1 -> nanobot-chat-history)."
              fi
            fi
          fi
          echo "Wrangler D1 configuration:"
          grep -E 'database_name|database_id|CORS_ORIGIN' wrangler.toml

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'worker'
          command: deploy
