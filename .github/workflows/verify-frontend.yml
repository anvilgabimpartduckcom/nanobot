# GitHub Actions workflow verifying frontend build and TypeScript checks [Commented by: Google AI Studio on 15/10/2026 10:16 AM]

name: Verify Frontend Build

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'index.html'
      - '.github/workflows/verify-frontend.yml'
  pull_request:
# Explicit read-only permissions block resolving CodeQL actions/missing-workflow-permissions vulnerability [Commented by: Google AI Studio on 22/10/2026 04:47 AM]
permissions:
  contents: read

jobs:
  verify:
    name: Typecheck & Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Configured Node.js 24 LTS setup with npm cache and reproducible npm ci using committed package-lock.json [Commented by: Google AI Studio on 22/10/2026 06:25 AM]
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check (Lint)
        run: npm run lint

      - name: Build Production Bundle
        run: npm run build
