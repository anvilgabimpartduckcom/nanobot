# {GitHub Actions workflow verifying frontend build and TypeScript checks} [Commented by: Google AI Studio on 15/10/2026 10:16 AM]

name: Verify Frontend Build

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'index.html'
      - '.github/workflows/verify-frontend.yml'
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Typecheck & Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # {Configured Node.js setup with npm cache keyed to root package.json and safe dependency install} [Commented by: Google AI Studio on 17/10/2026 03:00 AM]
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package.json'

      - name: Install Dependencies
        run: npm install

      - name: Type Check (Lint)
        run: npm run lint

      - name: Build Production Bundle
        run: npm run build
