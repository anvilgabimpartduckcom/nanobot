name: Integration Compatibility Monitor

on:
  schedule:
    - cron: "15 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: integration-compatibility-monitor
  cancel-in-progress: false

jobs:
  check-provider-updates:
    name: Check official provider updates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore monitor state
        uses: actions/cache/restore@v4
        with:
          path: docs/integration-monitor-state.json
          key: integration-monitor-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            integration-monitor-state-

      - name: Validate monitor syntax
        run: python -m py_compile scripts/integration_compatibility_monitor.py

      - name: Check feeds and report new updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/integration_compatibility_monitor.py

      - name: Save monitor state
        uses: actions/cache/save@v4
        with:
          path: docs/integration-monitor-state.json
          key: integration-monitor-state-${{ github.run_id }}-${{ github.run_attempt }}
