# {Wrangler configuration for Nanobot Cloudflare Worker binding DB to nanobot-chat-history D1 database} [Commented by: Google AI Studio on October 15, 2026 at 09:57 AM]

name = "nanobot-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "nanobot-chat-history"
database_id = "nanobot-d1-production"

[vars]
CORS_ORIGIN = "*"

# In Cloudflare Worker, configure secrets securely via dashboard or CLI:
# npx wrangler secret put SUPABASE_URL
# npx wrangler secret put SUPABASE_ANON_KEY
